<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="white"/>

  <text x="450" y="45"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#172033">
    Model vs Rule-Based Baseline
  </text>

  <text x="450" y="75"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#657084">
    Precision@50 on the same client-grouped holdout
  </text>

  <!-- Y axis -->
  <line x1="100" y1="110" x2="100" y2="450"
        stroke="#172033" stroke-width="2"/>

  <!-- X axis -->
  <line x1="100" y1="450" x2="840" y2="450"
        stroke="#172033" stroke-width="2"/>

  <!-- Grid -->
  <line x1="100" y1="382" x2="840" y2="382" stroke="#dfe5ee"/>
  <line x1="100" y1="314" x2="840" y2="314" stroke="#dfe5ee"/>
  <line x1="100" y1="246" x2="840" y2="246" stroke="#dfe5ee"/>
  <line x1="100" y1="178" x2="840" y2="178" stroke="#dfe5ee"/>
  <line x1="100" y1="110" x2="840" y2="110" stroke="#dfe5ee"/>

  <!-- Y labels -->
  <text x="82" y="455" text-anchor="end"
        font-family="Arial" font-size="14">0.0</text>
  <text x="82" y="387" text-anchor="end"
        font-family="Arial" font-size="14">0.2</text>
  <text x="82" y="319" text-anchor="end"
        font-family="Arial" font-size="14">0.4</text>
  <text x="82" y="251" text-anchor="end"
        font-family="Arial" font-size="14">0.6</text>
  <text x="82" y="183" text-anchor="end"
        font-family="Arial" font-size="14">0.8</text>
  <text x="82" y="115" text-anchor="end"
        font-family="Arial" font-size="14">1.0</text>

  <!-- Bars -->
  <!-- Baseline 0.48 -->
  <rect x="150" y="286.8" width="120" height="163.2"
        rx="5" fill="#7c8798"/>
  <text x="210" y="274"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.48</text>

  <!-- Logistic 0.66 -->
  <rect x="330" y="225.6" width="120" height="224.4"
        rx="5" fill="#2457d6"/>
  <text x="390" y="213"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.66</text>

  <!-- RF 0.58 -->
  <rect x="510" y="252.8" width="120" height="197.2"
        rx="5" fill="#4f79b8"/>
  <text x="570" y="240"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.58</text>

  <!-- HGB 0.56 -->
  <rect x="690" y="259.6" width="120" height="190.4"
        rx="5" fill="#7390b8"/>
  <text x="750" y="247"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.56</text>

  <!-- X labels -->
  <text x="210" y="482"
        text-anchor="middle"
        font-family="Arial"
        font-size="14">
    Rule Baseline
  </text>

  <text x="390" y="482"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        font-weight="700">
    Logistic Regression
  </text>

  <text x="570" y="482"
        text-anchor="middle"
        font-family="Arial"
        font-size="14">
    Random Forest
  </text>

  <text x="750" y="482"
        text-anchor="middle"
        font-family="Arial"
        font-size="14">
    Gradient Boosting
  </text>

  <text x="25" y="290"
        transform="rotate(-90 25 290)"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="700">
    Precision@50
  </text>

  <text x="450" y="530"
        text-anchor="middle"
        font-family="Arial"
        font-size="13"
        fill="#657084">
    Final model selected by the operational top-50 ranking metric.
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="white"/>

  <text x="450" y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#172033">
    Validation Audit
  </text>

  <text x="450" y="70"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#657084">
    Random row split vs honest grouped-client holdout
  </text>

  <!-- Y axis -->
  <line x1="120" y1="110" x2="120" y2="410"
        stroke="#172033" stroke-width="2"/>

  <!-- X axis -->
  <line x1="120" y1="410" x2="790" y2="410"
        stroke="#172033" stroke-width="2"/>

  <!-- Grid -->
  <line x1="120" y1="350" x2="790" y2="350" stroke="#dfe5ee"/>
  <line x1="120" y1="290" x2="790" y2="290" stroke="#dfe5ee"/>
  <line x1="120" y1="230" x2="790" y2="230" stroke="#dfe5ee"/>
  <line x1="120" y1="170" x2="790" y2="170" stroke="#dfe5ee"/>
  <line x1="120" y1="110" x2="790" y2="110" stroke="#dfe5ee"/>

  <!-- Y labels -->
  <text x="102" y="415" text-anchor="end" font-family="Arial" font-size="14">0.0</text>
  <text x="102" y="355" text-anchor="end" font-family="Arial" font-size="14">0.2</text>
  <text x="102" y="295" text-anchor="end" font-family="Arial" font-size="14">0.4</text>
  <text x="102" y="235" text-anchor="end" font-family="Arial" font-size="14">0.6</text>
  <text x="102" y="175" text-anchor="end" font-family="Arial" font-size="14">0.8</text>
  <text x="102" y="115" text-anchor="end" font-family="Arial" font-size="14">1.0</text>

  <!-- Bars -->
  <!-- Random split 0.72 -->
  <rect x="220" y="194" width="160" height="216"
        rx="6" fill="#6c8ecf"/>
  <text x="300" y="180"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.72</text>

  <!-- Grouped split 0.66 -->
  <rect x="500" y="212" width="160" height="198"
        rx="6" fill="#2457d6"/>
  <text x="580" y="198"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        font-weight="700">0.66</text>

  <!-- Labels -->
  <text x="300" y="442"
        text-anchor="middle"
        font-family="Arial"
        font-size="14">
    Random row split
  </text>

  <text x="580" y="442"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        font-weight="700">
    Grouped client holdout
  </text>

  <!-- Side note -->
  <rect x="610" y="120" width="210" height="58" rx="10" fill="#f4f7fd" stroke="#d8e1fa"/>
  <text x="715" y="145"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        font-weight="700"
        fill="#173b96">
    Client overlap = 0
  </text>
  <text x="715" y="165"
        text-anchor="middle"
        font-family="Arial"
        font-size="13"
        fill="#657084">
    More honest generalization estimate
  </text>

  <text x="35" y="260"
        transform="rotate(-90 35 260)"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="700">
    Precision@50
  </text>

  <text x="450" y="490"
        text-anchor="middle"
        font-family="Arial"
        font-size="13"
        fill="#657084">
    The grouped-client result is the principal reported performance estimate.
  </text>
</svg>
